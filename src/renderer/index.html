<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日提醒与日程</title><link rel="stylesheet" href="styles.css"><style>.calendar-weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:103px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:left;color:var(--text)}.day.drag-target{background:var(--accent-soft);border-color:var(--accent);outline:2px dashed var(--accent)}.todo-item[draggable=true]{cursor:grab}.todo-item[draggable=true]:active{cursor:grabbing}.calendar.day-view{grid-template-columns:1fr}.calendar.day-view .day{min-height:250px}.calendar.week-view .day{min-height:150px}</style></head>
<body>
  <link rel="stylesheet" href="updates.css">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">日</div><div><b>每日提醒与日程</b><small>专注每一天</small></div></div>
      <nav id="nav"><button data-page="overview" class="active">⌂ <span>今日概览</span></button><button data-page="todos">✓ <span>今日待办</span></button><button data-page="schedule">▦ <span>日程概况</span></button><button data-page="overdue">! <span>逾期事项</span></button><button data-page="reminders">◷ <span>重要提醒</span></button><button data-page="history">◴ <span>历史记录</span></button><button data-page="appearance">✦ <span>外观设置</span></button><button data-page="data">⇅ <span>数据设置</span></button><button data-page="updates">↑ <span>软件更新</span></button></nav>
      <div class="sidebar-bottom"><button id="trayBtn" class="quiet">⌄ 最小化到托盘</button><small>本地数据 · 无需联网</small></div>
    </aside>
    <main class="main"><header class="topbar"><div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">今日概览</h1></div><div class="top-actions"><button id="todayBtn" class="secondary">回到今天</button><button id="newTodoBtn" class="primary">＋ 新增待办</button></div></header>
      <section id="page-overview" class="page active"></section>
      <section id="page-todos" class="page"></section>
      <section id="page-schedule" class="page"></section>
      <section id="page-overdue" class="page"></section>
      <section id="page-reminders" class="page"></section>
      <section id="page-history" class="page"></section>
      <section id="page-appearance" class="page"></section>
      <section id="page-data" class="page"></section>
      <section id="page-updates" class="page"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">新增待办</h2><button id="closeModal" class="icon-btn">×</button></div><form id="todoForm"><input type="hidden" name="id"><label>标题<input name="title" required maxlength="120" placeholder="例如：完成周报"></label><label>详细内容<textarea name="body" rows="3" placeholder="补充说明"></textarea></label><div class="form-grid"><label>日期<input name="date" type="date" required></label><label>开始时间<input name="startTime" type="time"></label><label>截止时间<input name="dueTime" type="time"></label><label>优先级<select name="priority"><option value="normal">普通</option><option value="important">重要</option><option value="urgent">紧急</option></select></label><label>分类<input name="category" placeholder="工作 / 生活"></label><label>重复<select name="repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="custom">自定义星期</option></select></label></div><div id="repeatExtra" class="repeat-extra hidden"><label>重复结束日期<input name="endDate" type="date"></label><div class="weekday-row"><label><input type="checkbox" name="weekdays" value="1">一</label><label><input type="checkbox" name="weekdays" value="2">二</label><label><input type="checkbox" name="weekdays" value="3">三</label><label><input type="checkbox" name="weekdays" value="4">四</label><label><input type="checkbox" name="weekdays" value="5">五</label><label><input type="checkbox" name="weekdays" value="6">六</label><label><input type="checkbox" name="weekdays" value="0">日</label></div></div><div id="editScopeWrap" class="hidden"><label>修改范围<select name="editScope"><option value="single">仅本次</option><option value="future">本次及以后</option><option value="series">整个重复系列</option></select></label></div><label>具体提醒时间<input name="remindAt" type="datetime-local"><small class="hint">可添加多个具体提醒时刻；相对截止时间的提前提醒可在下方设置。</small></label><div id="additionalReminders"></div><button type="button" id="addReminderTime" class="secondary">＋ 添加另一个提醒时间</button><div class="form-grid"><label>提前提醒<select name="reminderAdvance"><option value="default">使用默认提前提醒</option><option value="none">不自动提前提醒</option><option value="5">提前 5 分钟</option><option value="15">提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option><option value="custom">自定义分钟</option></select></label><label id="customAdvanceWrap" class="hidden">自定义分钟数<input name="customAdvance" type="number" min="1" max="10080" value="15"></label></div><label class="check-line"><input name="importantReminder" type="checkbox"> 将此提醒标记为重要</label><div class="form-actions"><button type="button" id="cancelModal" class="secondary">取消</button><button class="primary" type="submit">保存待办</button></div></form></div></div>
  <script src="updates.js"></script>
  <script src="app.js"></script>
</body></html>
